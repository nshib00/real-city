global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  # Самостоятельный worker подключается в worker-targets.yml только после
  # отключения встроенной симуляции API (SIMULATION_EMBEDDED=false).
  - job_name: worker
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/worker-targets.yml
        refresh_interval: 30s
