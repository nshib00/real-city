name: audio

on:
  push:
    paths:
      - .github/workflows/audio.yml
      - tools/audio/**
      - frontend/src/audio/**
      - frontend/src/features/buildings/**
      - frontend/src/features/world/**
      - frontend/src/features/settings/**
      - shared/events/**
      - backend/internal/service/forest.go
      - backend/internal/service/forest_test.go
      - frontend/public/assets/audio/**
      - frontend/scripts/check-asset-budget.mjs
  pull_request:
    paths:
      - .github/workflows/audio.yml
      - tools/audio/**
      - frontend/src/audio/**
      - frontend/src/features/buildings/**
      - frontend/src/features/world/**
      - frontend/src/features/settings/**
      - shared/events/**
      - backend/internal/service/forest.go
      - backend/internal/service/forest_test.go
      - frontend/public/assets/audio/**
      - frontend/scripts/check-asset-budget.mjs

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 tools/audio/validate_audio.py --catalog
      - run: python3 tools/audio/test_audio.py
      - run: npm ci
        working-directory: frontend
      - run: npm run assets:budget
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test -- --run src/audio src/features/world/realtime.test.ts src/features/world/combatAudio.test.ts src/features/buildings/BuildMenu.test.tsx
        working-directory: frontend
      - run: go test ./internal/service ./internal/adapter/ws
        working-directory: backend
