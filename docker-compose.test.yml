services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: real_city
      POSTGRES_USER: real_city
      POSTGRES_PASSWORD: real_city
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U real_city -d real_city"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_test_data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      APP_ENV: test
      SERVER_ADDR: :8080
      POSTGRES_DSN: postgres://real_city:real_city@postgres:5432/real_city?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB: 1
      SESSION_SECRET: change-me-in-test-env
      STORAGE_PUBLIC_URL: http://localhost:18080/assets
      LOG_LEVEL: debug
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_test_data:
  redis_test_data:
