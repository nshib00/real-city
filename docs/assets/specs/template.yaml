# Шаблон спецификации ассета для Blender Asset Factory.
# Копируйте файл в подкаталог категории и заменяйте значения, не разворачивая
# полный арт-гайд в prompt. Длинные описания остаются в docs/buildings/**.
asset_id: example_building
category: housing
kind: building
display_name: Пример здания
style_profile: aeolian_fantasy_midpoly

footprint:
  width: 1
  height: 1

levels:
  - level: 1
    visual_goal: Короткое описание силуэта и главного читаемого апгрейда.
    cost_resources: [wood, stone]
    triangle_budget: { min: 1500, max: 3500 }
    adds:
      - Крупная деталь, которую нужно добавить геометрией.
    constraints:
      - Не закрывать соседние клетки.

states: [active, construction, damaged]

# Для building-ассетов обязательна карта: каждый значимый ресурс стоимости
# должен стать видимой деталью, материалом или акцентом модели.
material_map:
  wood:
    visible_as: светлые доски, балки, подпорки
    priority: primary
    levels: [1]
  stone:
    visible_as: каменный цоколь и крупные камни у входа
    priority: secondary
    levels: [1]

level_progression:
  mass:
    rule: Каждый уровень добавляет объем или пристройку, а не только меняет цвет.
  height:
    rule: Высота растет постепенно и остается читаемой в 1x1 footprint.
  materials:
    rule: Новые ресурсы из стоимости появляются как крупные видимые материалы.
  props:
    rule: Props крупные, редкие и читаемые с изометрической камеры.
  late_elements:
    rule: Поздние элементы добавляются только на уровнях, где они поддержаны балансом.
  constraints:
    - Сохранять ориентацию входа.
    - Сохранять основной силуэт между active/construction/damaged.

state_policy:
  active:
    rule: Готовое здание без строительных лесов и без крупных разрушений.
  construction:
    rule: Незавершенный каркас целевого уровня с материалами на площадке.
    required_elements: [scaffolding, unfinished_frame, stacked_materials]
  damaged:
    rule: Повреждения читаются крупно, но силуэт и вход остаются узнаваемыми.
    required_elements: [broken_roof_edges, cracks, debris]
    forbidden_elements: [full_collapse]

skill_profile:
  base: [blender-director, genre-strategy-sim, isometric-style, fantasy-worlds, stylized-style, hand-painted-style]
  asset_type: [environment-artist]
  production: [materials, texture-workflow, lookdev, lod-pipeline, asset-optimization, export-pipeline]
  validation: [qa-review]

lod_policy:
  chain:
    - name: LOD0
      ratio: 1.0
      triangle_budget: { min: 1500, max: 3500 }
      export: true
    - name: LOD1
      ratio: 0.45
      triangle_budget: { min: 700, max: 1800 }
      export: true
    - name: LOD2
      ratio: 0.22
      triangle_budget: { min: 300, max: 800 }
      export: true
  preserve: [footprint, primary silhouette, entrance orientation, largest readable props]
  exports:
    naming: "{asset_id}_l{level:02d}_{state}_{lod}.glb"
    include_lod0: true
    include_lod1: true
    include_lod2: true

png_policy:
  sprite_size: [512, 384]
  camera_profile: real_city_isometric
  transparent_background: true
  anchor: [256, 292]
  render_lod: LOD0
  contact_sheet:
    enabled: true
    columns: 4
    include_states: [active, construction, damaged]
  alpha_bounds:
    min_opaque_pixels: 1200
    max_crop_margin_px: 10
    bottom_anchor_tolerance_px: 10

atlas_policy:
  enabled: true
  image_format: webp
  json_naming: "{asset_id}.atlas.json"
  image_naming: "{asset_id}.webp"
  padding_px: 2
  max_texture_size: 4096
  include_static_sprites: true
  include_animation_frames: true

animation_policy:
  frame_size: [512, 384]
  anchor: [256, 292]
  frame_naming: "{asset_id}_l{level:02d}_{animation}_{frame:04d}.png"
  contact_sheet:
    enabled: true
    columns: 8
    output_name: animation-contact-sheet.png
  building_overlays:
    - id: working
      type: overlay
      fps: 8
      frames: 12
      loop: true
      frame_prefix: "{asset_id}_l{level:02d}_working_"
      states: [active]

output:
  runtime_dir: frontend/public/assets/buildings/housing/example_building
  source_dir: frontend/src/assets/buildings/housing/example_building
  use_public_glb: true

references:
  docs:
    - docs/buildings/houses/example-building.md
  art_guide: docs/art/visual-style-guide.md
  existing_generators: []
  existing_assets: []

notes:
  - Короткие производственные заметки, если они нужны генератору.
