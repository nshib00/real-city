asset_id: oil_well
category: industry
kind: building
display_name: Нефтяная вышка
style_profile: aeolian_fantasy_midpoly

footprint:
  width: 1
  height: 1

levels:
  - level: 1
    visual_goal: "Ранняя буровая вышка над нефтяным пятном: широкая деревянно-металлическая рама, дощатый настил, простая качалка, бочки, веревочные растяжки и ящик инструментов."
    cost_resources: [coins, metal, planks]
    triangle_budget: { min: 1800, max: 3600 }
    adds: [broad_simple_derrick, plank_deck, manual_pumpjack, oil_barrels, guy_ropes]
    constraints:
      - Сохранять яркую плоскую ground-клетку Real City, а нефтяное пятно делать локальным акцентом.
      - Не делать вышку мрачной, грязной или реалистично-индустриальной; стиль остается светлой эолийской стратегической диорамой.
states: [active, construction, damaged, ruined]

material_map:
  metal:
    visible_as: изношенные металлические стойки, крепежные пластины, ручной насос и бочки уровня 1
    priority: primary
    levels: [1]
  planks:
    visible_as: дощатый настил, деревянные балки рамы, ящик инструментов и строительные штабели
    priority: primary
    levels: [1]
  oil:
    visible_as: локальная глянцевая черная нефтяная лужа в центре и небольшие потеки в поврежденных состояниях
    priority: secondary
    levels: [1]

level_progression:
  mass:
    rule: Вышка растет через высоту, ширину фермы, сервисные площадки и резервуары, но остается в 1x1 footprint.
  height:
    rule: Высота увеличивается от простой деревянно-металлической рамы к усиленной промышленной ферме; камера и масштаб PNG не подгоняются отдельно под силуэт.
  materials:
    rule: Новые ресурсы стоимости становятся крупными видимыми частями конструкции, а не только ящиками рядом.
  props:
    rule: "Props крупные и функциональные: бочки, трубы, насосный блок, резервуар, ящик инструментов, warning-лампа."
  ground:
    rule: Основание всегда использует общую плоскую клетку земли Real City с яркой травой, тем же изометрическим масштабом и anchor, что у остальных building sprites.
  constraints:
    - Нефтяное пятно должно быть видно под устьем скважины во всех состояниях.
    - Не копировать формы, иконки или композиции Gnomgrad.
    - Не использовать отдельную толстую платформу или темную подложку вместо общей ground-клетки.

state_policy:
  active:
    rule: Полная рабочая вышка без строительных лесов и без крупных разрушений; pumpjack/tower silhouette читается в 512x384 и в уменьшенном размере.
    required_elements: [derrick_frame, wellhead, pumpjack, pipes_or_barrels, shared_ground_cell]
  construction:
    rule: "Недостроенная версия целевого уровня: верхняя часть рамы собрана не полностью, часть труб/механизмов отсутствует, рядом лежат балки, трубы и ящики."
    required_elements: [unfinished_frame, loose_planks_or_pipes, stacked_materials, shared_ground_cell]
    forbidden_elements: [fully_finished_derrick_with_only_scaffolding]
  damaged:
    rule: "Повреждения крупные и читаемые: перекошенная рама, сломанные трубы, заклинивший насос, нефтяная течь и аварийный янтарный сигнал."
    required_elements: [tilted_frame, broken_pipe, oil_leak, damaged_pump, shared_ground_cell]
  ruined:
    rule: Рама схлопнулась в обломки над нефтяной точкой; клетка занята руинами здания, но нефтяное пятно и footprint остаются узнаваемыми.
    required_elements: [fallen_beams, smashed_pump, debris_on_ground, visible_oil_source, shared_ground_cell]

skill_profile:
  base: [blender-director, genre-strategy-sim, isometric-style, fantasy-worlds, stylized-style, hand-painted-style]
  asset_type: [environment-artist, prop-artist, hard-surface]
  production: [materials, texture-workflow, lookdev, lod-pipeline, asset-optimization, export-pipeline]
  validation: [qa-review]

lod_policy:
  chain:
    - name: LOD0
      ratio: 1.0
      triangle_budget: { min: 1800, max: 3600 }
      export: true
    - name: LOD1
      ratio: 0.55
      triangle_budget: { min: 850, max: 1900 }
      export: true
    - name: LOD2
      ratio: 0.28
      triangle_budget: { min: 350, max: 900 }
      export: true
  preserve: [footprint, derrick silhouette, wellhead, pumpjack beam, largest pipes and tanks]
  exports:
    naming: "{asset_id}_l{level:02d}_{state}_{lod}.glb"
    include_lod0: true
    include_lod1: true
    include_lod2: true

png_policy:
  sprite_size: [512, 384]
  camera_profile: real_city_isometric
  transparent_background: true
  anchor: [256, 292]
  render_lod: LOD0
  contact_sheet:
    enabled: true
    columns: 4
    include_states: [active, construction, damaged, ruined]
  alpha_bounds:
    min_opaque_pixels: 1200
    max_crop_margin_px: 10
    bottom_anchor_tolerance_px: 10

output:
  runtime_dir: frontend/public/assets/buildings/industry/oil_well
  source_dir: frontend/src/assets/buildings/industry/oil_well
  use_public_glb: true

references:
  docs:
    - docs/buildings/resource-buildings/oil-well.md
    - docs/art/visual-style-guide.md
    - docs/assets/blender-models-web-pipeline.md
  existing_generators:
    - tools/assets/blender/generate_oil_well_models.py
    - tools/assets/blender/generate_mine_models.py
    - tools/assets/blender/generate_clay_quarry_models.py
  existing_assets:
    - frontend/public/assets/buildings/industry/oil_well/
    - frontend/public/assets/buildings/industry/mine/
    - frontend/public/assets/buildings/industry/clay_quarry/
    - frontend/public/assets/buildings/center/town_hall/
    - frontend/public/assets/buildings/housing/dugout/

notes:
  - Этот production spec привязан к текущему shared/catalog/buildings.ts, где `oil_well` имеет только уровень 1. Идеи визуальных уровней 2-3 остаются в docs/buildings/resource-buildings/oil-well.md и уже созданном runtime-наборе, но не должны использоваться для build rules, пока каталог не получит апгрейды.
  - Уровень 1 active должен выглядеть как часть общего building layer: та же изометрическая камера, та же плоская клетка земли, яркие материалы и крупные читаемые детали.
