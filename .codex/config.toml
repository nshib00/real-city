[mcp_servers.playwright]
enabled = false
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.blender]
enabled = true
command = "/home/nshib/.local/share/real-city-blender-mcp/venv/bin/mcp-for-blender"
args = []

[mcp_servers.blender.env]
BLENDER_HOST = "127.0.0.1"
BLENDER_PORT = "9876"
DISABLE_TELEMETRY = "true"

[mcp_servers.blender.tools.get_scene_info]
approval_mode = "approve"

[mcp_servers.blender.tools.get_addon_status]
approval_mode = "approve"

[mcp_servers.blender.tools.execute_blender_code]
approval_mode = "approve"

[mcp_servers.blender.tools.look]
approval_mode = "approve"
